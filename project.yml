name: NeonVoid
options:
  bundleIdPrefix: com.neonvoid
  deploymentTarget:
    iOS: "18.0"
    visionOS: "2.0"
    tvOS: "18.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
    SUPPORTS_MACCATALYST: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIStatusBarHidden: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"

targets:
  NeonVoid:
    type: application
    platform: iOS
    sources:
      - path: NeonVoid
        excludes:
          - WebContent/**
    resources:
      - path: NeonVoid/WebContent
        buildPhase: resources
        type: folder
      - path: NeonVoid/Assets.xcassets
      - path: NeonVoid/PrivacyInfo.xcprivacy
    postCompileScripts:
      - script: |
          if [ ! -d "$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/WebContent" ]; then
            cp -R "$SRCROOT/NeonVoid/WebContent" "$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/WebContent"
            echo "Copied WebContent to app bundle"
          fi
        name: Copy WebContent Fallback
        basedOnDependencyAnalysis: false
    info:
      path: NeonVoid/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        CFBundleDisplayName: Last Pilot
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.games
        CFBundleShortVersionString: "1.0.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neonvoid.arcade
        PRODUCT_NAME: NeonVoid
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  NeonVoidVision:
    type: application
    platform: visionOS
    sources:
      - path: NeonVoidVision
      - path: NeonVoid/GameWebView.swift
    resources:
      - path: NeonVoid/WebContent
        type: folder
      - path: NeonVoidVision/Assets.xcassets
      - path: NeonVoid/PrivacyInfo.xcprivacy
    postCompileScripts:
      - script: |
          if [ ! -d "$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/WebContent" ]; then
            cp -R "$SRCROOT/NeonVoid/WebContent" "$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/WebContent"
          fi
          cp "$SRCROOT/NeonVoid/PrivacyInfo.xcprivacy" "$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/PrivacyInfo.xcprivacy"
        name: Copy WebContent and Privacy Manifest
        basedOnDependencyAnalysis: false
    info:
      path: NeonVoidVision/Info.plist
      properties:
        CFBundleDisplayName: Last Pilot
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.games
        CFBundleShortVersionString: "1.0.0"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neonvoid.vision
        PRODUCT_NAME: NeonVoidVision
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"

  NeonVoidTV:
    type: application
    platform: tvOS
    sources:
      - path: NeonVoidTV
    resources:
      - path: NeonVoid/WebContent
        type: folder
      - path: NeonVoidTV/Assets.xcassets
      - path: NeonVoid/PrivacyInfo.xcprivacy
    postCompileScripts:
      - script: |
          if [ ! -d "$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/WebContent" ]; then
            cp -R "$SRCROOT/NeonVoid/WebContent" "$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/WebContent"
          fi
          cp "$SRCROOT/NeonVoid/PrivacyInfo.xcprivacy" "$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/PrivacyInfo.xcprivacy"
        name: Copy WebContent and Privacy Manifest
        basedOnDependencyAnalysis: false
    info:
      path: NeonVoidTV/Info.plist
      properties:
        CFBundleDisplayName: Last Pilot
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.games
        CFBundleShortVersionString: "1.0.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neonvoid.tv
        PRODUCT_NAME: NeonVoidTV
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
